site_name: Agentic Delivery Handbook
site_description: Running a whole software engagement with agents.
site_author: George Thomas
site_url: https://handbook.redmoor.io/
repo_url: https://github.com/georgethomasuk/agentic-handbook
edit_uri: ""
copyright: >-
  © 2026 George Thomas · Guide text <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>
  · Prompts, templates and scripts <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a>
  · <a href="https://github.com/georgethomasuk/agentic-handbook/blob/main/LICENSE">Licence</a>

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences

