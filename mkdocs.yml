site_name: Agentic Delivery Handbook
site_description: Running a whole software engagement with agents.
site_author: George Thomas
site_url: https://handbook.redmoor.io/
repo_url: https://github.com/georgethomasuk/agentic-handbook
edit_uri: ""
copyright: >-
  © 2026 George Thomas · Guide text <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>
  · Prompts, templates and scripts <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a>
  · <a href="https://github.com/georgethomasuk/agentic-handbook/blob/main/LICENSE">Licence</a>

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - The example system and glossary: reference/example-system.md
  - 0 · What this is (not yet written): parts/00-what-this-is.md
  - 1 · Framing the work (not yet written): parts/01-framing-the-work/README.md
  - 2 · Designing the system (not yet written): parts/02-system-design/README.md
  - 3 · Attacking it before building it:
      - 3 · Attacking it before building it: parts/03-threat-modelling/README.md
      - The agent prompts: parts/03-threat-modelling/prompt.md
      - Templates: parts/03-threat-modelling/templates/README.md
  - 4 · Designing the surfaces (not yet written): parts/04-design/README.md
  - 5 · Planning the delivery (not yet written): parts/05-delivery-planning/README.md
  - 6 · Supervising the run (not yet written): parts/06-supervision/README.md
  - 7 · Keeping it honest (not yet written): parts/07-keeping-it-honest/README.md
  - 8 · The machine (not yet written): parts/08-the-machine/README.md
